version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_DB: devfolio_db
      POSTGRES_USER: devfolio_user
      POSTGRES_PASSWORD: devfolio_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U devfolio_user"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build: .
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    ports:
      - "8000:8000"
    environment:
      - DEBUG=True
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=devfolio_db
      - DB_USER=devfolio_user
      - DB_PASSWORD=devfolio_password
      - DB_HOST=db
      - DB_PORT=5432
      - SECRET_KEY=your-secret-key-change-in-production
    depends_on:
      db:
        condition: service_healthy

  redis:
    image: redis:7
    ports:
      - "6379:6379"

  celery:
    build: .
    command: celery -A devfolio worker -l info
    volumes:
      - .:/app
    environment:
      - DEBUG=True
      - DB_ENGINE=django.db.backends.postgresql
      - DB_NAME=devfolio_db
      - DB_USER=devfolio_user
      - DB_PASSWORD=devfolio_password
      - DB_HOST=db
      - DB_PORT=5432
    depends_on:
      - db
      - redis

volumes:
  postgres_data:
  static_volume:
  media_volume:
